name: UniAI - Automatic MAKAUT Notice Sync


on:
  workflow_dispatch:


permissions:
  contents: read

concurrency:
  group: uniai-notice-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      MONGO_URI: ${{ secrets.MONGO_URI }}
      PINECONE_API_KEY: ${{ secrets.PINECONE_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      LLM_PROVIDER: groq
      GROQ_MODEL: openai/gpt-oss-20b
      SYNC_PROCESS_LIMIT: "0"
      SYNC_INDEX_LIMIT: "0"
      SYNC_RECHECK_EXISTING: "0"
      SYNC_MAX_ATTEMPTS: "4"
      AUTO_APPROVE_LONG_NOTICES: "0"

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-phase5.txt

      - name: Install free OCR dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq tesseract-ocr poppler-utils

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements-phase5.txt

      - name: Check required secrets
        shell: bash
        run: |
          test -n "$MONGO_URI" || (echo "MONGO_URI secret is missing" && exit 1)
          test -n "$PINECONE_API_KEY" || (echo "PINECONE_API_KEY secret is missing" && exit 1)
          test -n "$GROQ_API_KEY" || (echo "GROQ_API_KEY secret is missing" && exit 1)

      - name: Run incremental MAKAUT synchronization
        run: python backend/scheduler/sync_notices.py
