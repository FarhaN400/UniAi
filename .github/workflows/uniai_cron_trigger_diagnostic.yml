name: UniAI - Cron Trigger Diagnostic

on:
  workflow_dispatch:
  schedule:
    - cron: "7,22,37,52 * * * *"

permissions:
  contents: read

jobs:
  heartbeat:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Report trigger
        env:
          TRIGGER: ${{ github.event_name }}
          REF: ${{ github.ref }}
        run: |
          echo "Trigger: $TRIGGER"
          echo "Branch: $REF"
          echo "UTC time: $(date -u '+%Y-%m-%dT%H:%M:%SZ')"
          if [ "$TRIGGER" != "schedule" ]; then
            echo "INFO: This run was not automatically scheduled."
          else
            echo "PASS: GitHub schedule event fired."
          fi
