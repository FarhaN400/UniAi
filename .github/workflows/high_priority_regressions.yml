name: High Priority UniAI Regressions

on:
  pull_request:
    paths:
      - 'backend/Module4/main.py'
      - 'backend/retrieve.py'
      - 'backend/notice_dates.py'
      - 'backend/review_workflow.py'
      - 'backend/scheduler/review_notices.py'
      - 'frontend/src/pages/Chat.jsx'
      - 'frontend/src/lib/sources.js'
      - 'frontend/tests/sources.test.mjs'
      - 'backend/tests/test_high_priority_batch.py'
      - '.github/workflows/high_priority_regressions.yml'
  push:
    branches: ['fix/high-priority-5-8-batch']
    paths:
      - 'backend/Module4/main.py'
      - 'backend/retrieve.py'
      - 'backend/notice_dates.py'
      - 'backend/review_workflow.py'
      - 'backend/scheduler/review_notices.py'
      - 'frontend/src/pages/Chat.jsx'
      - 'frontend/src/lib/sources.js'
      - 'frontend/tests/sources.test.mjs'
      - 'backend/tests/test_high_priority_batch.py'
      - '.github/workflows/high_priority_regressions.yml'

jobs:
  python-regressions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile modified Python modules
        run: python -m py_compile backend/Module4/main.py backend/retrieve.py backend/notice_dates.py backend/review_workflow.py backend/scheduler/review_notices.py
      - name: Run offline unit tests
        env:
          PYTHONPATH: backend
        run: python -m unittest discover -s backend/tests -p 'test_high_priority_batch.py' -v

  frontend-regressions:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Check source attribution
        run: node --test tests/sources.test.mjs
      - name: Build frontend
        run: npm run build
