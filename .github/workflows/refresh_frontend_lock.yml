name: Refresh frontend dependency lockfile

on:
  push:
    branches:
      - fix/frontend-security-dependencies
    paths:
      - frontend/package.json
      - .github/workflows/refresh_frontend_lock.yml

permissions:
  contents: write

jobs:
  regenerate-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Resolve security dependency changes
        working-directory: frontend
        run: npm install --package-lock-only --ignore-scripts --no-fund --no-audit
      - name: Commit deterministic lockfile
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: lock patched frontend security dependencies"
            git push origin HEAD:fix/frontend-security-dependencies
          fi
