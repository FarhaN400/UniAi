name: UniAI - Atlas API Preflight

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      ATLAS_CLIENT_ID: ${{ secrets.ATLAS_CLIENT_ID }}
      ATLAS_CLIENT_SECRET: ${{ secrets.ATLAS_CLIENT_SECRET }}
      ATLAS_PROJECT_ID: ${{ vars.ATLAS_PROJECT_ID }}
    steps:
      - name: Configure Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Verify Atlas Administration API access (read-only)
        shell: bash
        run: |
          python - <<'PY'
          import base64
          import json
          import os
          import re
          import sys
          import urllib.error
          import urllib.parse
          import urllib.request

          client_id = os.environ.get("ATLAS_CLIENT_ID", "")
          secret = os.environ.get("ATLAS_CLIENT_SECRET", "")
          project_id = os.environ.get("ATLAS_PROJECT_ID", "")

          if not client_id or not secret:
              sys.exit("MISSING: ATLAS_CLIENT_ID or ATLAS_CLIENT_SECRET GitHub secret")
          if not re.fullmatch(r"[a-f0-9]{24}", project_id):
              sys.exit("MISSING/INVALID: ATLAS_PROJECT_ID repository variable")

          basic = base64.b64encode(f"{client_id}:{secret}".encode()).decode()
          token_request = urllib.request.Request(
              "https://cloud.mongodb.com/api/oauth/token",
              data=urllib.parse.urlencode({"grant_type": "client_credentials"}).encode(),
              headers={
                  "Authorization": f"Basic {basic}",
                  "Content-Type": "application/x-www-form-urlencoded",
                  "Accept": "application/json",
              },
              method="POST",
          )
          try:
              with urllib.request.urlopen(token_request, timeout=25) as response:
                  token = json.load(response)["access_token"]
          except urllib.error.HTTPError as exc:
              sys.exit(f"FAIL: Atlas OAuth token request returned HTTP {exc.code}")
          except Exception as exc:
              sys.exit(f"FAIL: Atlas OAuth token request ({type(exc).__name__})")
          print("PASS: Atlas OAuth token obtained")

          access_request = urllib.request.Request(
              f"https://cloud.mongodb.com/api/atlas/v2/groups/{project_id}/accessList?itemsPerPage=1",
              headers={
                  "Authorization": f"Bearer {token}",
                  "Accept": "application/vnd.atlas.2025-03-12+json",
              },
              method="GET",
          )
          try:
              with urllib.request.urlopen(access_request, timeout=25) as response:
                  json.load(response)
          except urllib.error.HTTPError as exc:
              if exc.code == 403:
                  sys.exit("FAIL: HTTP 403: Atlas Administration API denied access from this runner. Check service-account API Access List / organization API IP policy and permissions.")
              if exc.code == 401:
                  sys.exit("FAIL: HTTP 401: Account is not authorized for this Atlas project.")
              sys.exit(f"FAIL: Atlas project access-list read returned HTTP {exc.code}")
          except Exception as exc:
              sys.exit(f"FAIL: Atlas project access-list read ({type(exc).__name__})")

          print("PASS: GitHub runner can access Atlas Administration API")
          print("Read-only test. No database IP entries were added or removed.")
          PY
